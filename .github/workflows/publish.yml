name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit:packages
      - run: node scripts/check-release.mjs
      - run: pnpm --filter @validity.ai/verify exec playwright install chromium --with-deps
      - run: pnpm --filter @validity.ai/verify-web exec node node_modules/@playwright/test/cli.js install chromium --with-deps
      - run: pnpm test
      - run: pnpm validity verify --all --cwd examples/basic-vite-app
      # pnpm 11 supports OIDC directly and resolves workspace:* dependencies.
      - name: Publish public packages using trusted publishing
        run: pnpm -r --filter './packages/*' publish --access public --no-git-checks --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
