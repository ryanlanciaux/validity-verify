name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit:packages
      - run: pnpm --filter @validity.ai/verify exec playwright install chromium --with-deps
      - run: pnpm --filter @validity.ai/verify-web exec node node_modules/@playwright/test/cli.js install chromium --with-deps
      - run: pnpm test
      - run: pnpm validity verify --all --cwd examples/basic-vite-app
