id: spec-contact
version: 1
status: frozen
source:
  prompt: Contact form accepts an email and POSTs /api/contact
  createdBy: user
runtime: web
targets:
  components:
    - src/components/ContactForm.tsx
criteria:
  - id: AC-1
    text: Email field is visible
    tier: hard
    checks:
      - expect:
          element:
            role: textbox
            name: Email
            state: visible
  - id: AC-2
    text: Send button is visible
    tier: hard
    checks:
      - expect:
          element:
            role: button
            name: Send
            state: visible
  - id: AC-3
    text: Submitting a valid email POSTs /api/contact
    tier: hard
    checks:
      - fill:
          role: textbox
          name: Email
          value: a@b.com
      - click:
          role: button
          name: Send
      - expect:
          network:
            method: POST
            url: /api/contact
            status: 2xx
    mocking: required
