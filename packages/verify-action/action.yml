name: 'validity verify'
description: 'Run validity verify --all on a pull request, upload report.html, post a status check.'
author: 'Spaceship Studio, LLC'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  working-directory:
    description: 'Project root that contains .validity/'
    required: false
    default: '.'
  changed-only:
    description: 'Only verify specs whose target components changed'
    required: false
    default: 'true'
  fail:
    description: 'Fail the job when a hard/property check fails'
    required: false
    default: 'true'
  comment:
    description: 'Post or update a PR comment with the verdict'
    required: false
    default: 'true'
  comment-detail:
    description: 'full or compact'
    required: false
    default: 'full'
  artifact-name:
    description: 'Name of the uploaded report artifact'
    required: false
    default: 'validity-report'
  export-check:
    description: 'Run validity spec export --check before verify'
    required: false
    default: 'false'

outputs:
  verdict:
    description: 'pass | fail | partial'
    value: ${{ steps.post.outputs.verdict }}
  report-artifact-url:
    description: 'URL of the uploaded report artifact'
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    - name: Install validity
      shell: bash
      run: |
        npm install -g @validity.ai/verify
        echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

    - name: Export drift check
      if: ${{ inputs.export-check == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: validity spec export --check

    - name: validity verify
      id: verify
      shell: bash
      continue-on-error: true
      working-directory: ${{ inputs.working-directory }}
      run: |
        ARGS="--all --report markdown --summary $GITHUB_STEP_SUMMARY"
        if [ "${{ inputs.changed-only }}" = "true" ]; then ARGS="$ARGS --changed"; fi
        validity verify $ARGS \
          --report-html validity-report.html \
          --check-output validity-check.json

    - name: Upload report artifact
      id: upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.working-directory }}/validity-report.html
          ${{ inputs.working-directory }}/validity-check.json
        if-no-files-found: warn

    - name: Post status check + PR comment
      id: post
      if: always()
      uses: actions/github-script@v7
      env:
        CHECK_JSON: ${{ inputs.working-directory }}/validity-check.json
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        POST_COMMENT: ${{ inputs.comment }}
        COMMENT_DETAIL: ${{ inputs.comment-detail }}
      with:
        script: |
          const post = require(process.env.GITHUB_ACTION_PATH + '/post-check.cjs');
          await post({ github, context, core });

    - name: Gate
      if: ${{ inputs.fail == 'true' && steps.verify.outcome == 'failure' }}
      shell: bash
      run: exit 1
